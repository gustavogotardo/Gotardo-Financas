name: gotardo-dev

# Infraestrutura de desenvolvimento (E0.3).
# Apps e serviços Python rodam no host (pnpm dev / uv) para hot-reload rápido.
# Uso: docker compose -f compose.dev.yaml up -d  (ou `make infra-up`)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gotardo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotardo}
      POSTGRES_DB: ${POSTGRES_DB:-gotardo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gotardo} -d ${POSTGRES_DB:-gotardo}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gotardo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gotardo-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gotardo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gotardo-secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/gotardo
        mc mb --ignore-existing local/gotardo-imports
        exit 0

volumes:
  postgres-data:
  redis-data:
  minio-data:
